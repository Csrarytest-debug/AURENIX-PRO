name: AURENIX V0.7.3 Windows build candidate (not GPU-certified)
on:
  push:
    branches: [aurenix-v0.7.3-source-2026-11-13]
  workflow_dispatch:

jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to package incomplete or older source
        shell: pwsh
        run: |
          $required = @(
            'v0.7.3/aurenix_pro.py', 'v0.7.3/background_remover_pro.py',
            'v0.7.3/inference_worker.py', 'v0.7.3/isolated_worker.py',
            'v0.7.3/requirements-gpu.txt', 'v0.7.3/wire_cleanup.py',
            'v0.7.3/PREPARE_MODEL.py', 'v0.7.3/AURENIX-PRO.iss',
            'v0.7.3/assets/bs_broadcast_glow.png'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error "Full V0.7.3 source has not been synchronized: $($missing -join ', ')"
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v0.7.3/requirements-gpu.txt
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r v0.7.3/requirements-gpu.txt
          python -m pip check
      - name: Syntax check and all standalone regression scripts
        shell: pwsh
        working-directory: v0.7.3
        run: |
          python -m compileall -q .
          $tests = @(Get-ChildItem -File -Filter 'test_*.py' | Sort-Object Name)
          if ($tests.Count -lt 18) { throw "Missing regression scripts: expected at least 18, found $($tests.Count)" }
          foreach ($test in $tests) {
            Write-Host "RUN $($test.Name)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "FAILED $($test.Name)" }
          }
      - name: Prepare required offline model weights
        shell: pwsh
        working-directory: v0.7.3
        run: |
          python PREPARE_MODEL.py
          if ($LASTEXITCODE -ne 0) { throw "Model preparation failed" }
          if (-not @(Get-ChildItem models -Filter '*.onnx' -Recurse -ErrorAction SilentlyContinue).Count) { throw "ONNX model not found" }
      - name: Package Windows portable candidate
        shell: pwsh
        working-directory: v0.7.3
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onedir --name AURENIX-PRO --collect-all rembg --collect-all onnxruntime --collect-all pymatting --collect-all nvidia.cudnn --collect-all nvidia.cublas --collect-all nvidia.cuda_runtime --collect-all nvidia.cuda_nvrtc --add-data 'assets;assets' --add-data 'models;models' aurenix_pro.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (-not (Test-Path 'dist/AURENIX-PRO/AURENIX-PRO.exe')) { throw "EXE missing" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Build installer candidate
        shell: pwsh
        working-directory: v0.7.3
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc 'AURENIX-PRO.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path 'Installer/AURENIX-PRO-BG-Remover-V0.7.3-Setup.exe')) { throw "Installer missing" }
      - name: Upload candidate files (not a certified release)
        uses: actions/upload-artifact@v4
        with:
          name: AURENIX-PRO-V0.7.3-Windows-UNVERIFIED
          path: |
            v0.7.3/dist/AURENIX-PRO/**
            v0.7.3/Installer/AURENIX-PRO-BG-Remover-V0.7.3-Setup.exe
          if-no-files-found: error
