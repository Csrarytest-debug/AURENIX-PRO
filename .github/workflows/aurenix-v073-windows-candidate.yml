name: AURENIX V0.7.3 Windows build candidate (not GPU-certified)
on:
  push:
    branches: [aurenix-v0.7.3-source-2026-11-13]
  workflow_dispatch:

jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to package incomplete or older source
        shell: pwsh
        run: |
          $required = @(
            'v0.7.3/aurenix_pro.py', 'v0.7.3/background_remover_pro.py',
            'v0.7.3/inference_worker.py', 'v0.7.3/isolated_worker.py',
            'v0.7.3/requirements-gpu.txt', 'v0.7.3/wire_cleanup.py',
            'v0.7.3/PREPARE_MODEL.py', 'v0.7.3/AURENIX-PRO.iss',
            'v0.7.3/assets/bs_broadcast_glow.png'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error "Full V0.7.3 source has not been synchronized: $($missing -join ', ')"
            exit 1
          }
      - name: Require trusted code-signing credentials for release artifacts
        shell: pwsh
        env:
          AURENIX_CODESIGN_PFX_BASE64: ${{ secrets.AURENIX_CODESIGN_PFX_BASE64 }}
          AURENIX_CODESIGN_PFX_PASSWORD: ${{ secrets.AURENIX_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AURENIX_CODESIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:AURENIX_CODESIGN_PFX_PASSWORD)) {
            throw 'No trusted signing certificate configured. Cannot publish a signed Windows installer.'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v0.7.3/requirements-gpu.txt
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r v0.7.3/requirements-gpu.txt
          python -m pip check
      - name: Syntax check and all standalone regression scripts
        shell: pwsh
        working-directory: v0.7.3
        run: |
          python -m compileall -q .
          $tests = @(Get-ChildItem -File -Filter 'test_*.py' | Sort-Object Name)
          if ($tests.Count -lt 18) { throw "Missing regression scripts: expected at least 18, found $($tests.Count)" }
          foreach ($test in $tests) {
            Write-Host "RUN $($test.Name)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "FAILED $($test.Name)" }
          }
      - name: Prepare required offline model weights
        shell: pwsh
        working-directory: v0.7.3
        run: |
          python PREPARE_MODEL.py
          if ($LASTEXITCODE -ne 0) { throw "Model preparation failed" }
          if (-not @(Get-ChildItem models -Filter '*.onnx' -Recurse -ErrorAction SilentlyContinue).Count) { throw "ONNX model not found" }
      - name: Package Windows portable candidate
        shell: pwsh
        working-directory: v0.7.3
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onedir --name AURENIX-PRO --collect-all rembg --collect-all onnxruntime --collect-all pymatting --collect-all nvidia.cudnn --collect-all nvidia.cublas --collect-all nvidia.cuda_runtime --collect-all nvidia.cuda_nvrtc --add-data 'assets;assets' --add-data 'models;models' aurenix_pro.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (-not (Test-Path 'dist/AURENIX-PRO/AURENIX-PRO.exe')) { throw "EXE missing" }
      - name: Digitally sign Windows application EXE
        shell: pwsh
        env:
          AURENIX_CODESIGN_PFX_BASE64: ${{ secrets.AURENIX_CODESIGN_PFX_BASE64 }}
          AURENIX_CODESIGN_PFX_PASSWORD: ${{ secrets.AURENIX_CODESIGN_PFX_PASSWORD }}
        run: |
          & .github/scripts/sign-windows.ps1 -File 'v0.7.3/dist/AURENIX-PRO/AURENIX-PRO.exe'
          if (-not $?) { throw 'Application EXE signing failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Build installer candidate
        shell: pwsh
        working-directory: v0.7.3
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc 'AURENIX-PRO.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path 'Installer/AURENIX-PRO-BG-Remover-V0.7.3-Setup.exe')) { throw "Installer missing" }
      - name: Digitally sign Windows Setup EXE
        shell: pwsh
        env:
          AURENIX_CODESIGN_PFX_BASE64: ${{ secrets.AURENIX_CODESIGN_PFX_BASE64 }}
          AURENIX_CODESIGN_PFX_PASSWORD: ${{ secrets.AURENIX_CODESIGN_PFX_PASSWORD }}
        run: |
          & .github/scripts/sign-windows.ps1 -File 'v0.7.3/Installer/AURENIX-PRO-BG-Remover-V0.7.3-Setup.exe'
          if (-not $?) { throw 'Installer signing failed' }
      - name: Inspect Windows installer and EXE security status
        shell: pwsh
        working-directory: v0.7.3
        run: |
          $exe = (Resolve-Path 'dist/AURENIX-PRO/AURENIX-PRO.exe').Path
          $installer = (Resolve-Path 'Installer/AURENIX-PRO-BG-Remover-V0.7.3-Setup.exe').Path
          $files = @($exe, $installer)
          $report = @()
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
            $report += [pscustomobject]@{
              File = [IO.Path]::GetFileName($file)
              SHA256 = $hash
              SignatureStatus = [string]$sig.Status
              Signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { 'UNSIGNED' }
            }
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              throw "Release blocked: valid trusted Authenticode signature and timestamp required: $file"
            }
          }
          $report | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'WINDOWS_SECURITY_REPORT.json'
          $mp = Get-Command Start-MpScan -ErrorAction SilentlyContinue
          if ($mp) {
            foreach ($file in $files) {
              Start-MpScan -ScanType CustomScan -ScanPath $file -ErrorAction Stop
              if (-not (Test-Path $file)) { throw "Windows Security removed or quarantined: $file" }
            }
            Write-Host 'Windows Defender custom scans completed on this runner; no clean-PC SmartScreen result is implied.'
          } else {
            Write-Warning 'Microsoft Defender scanning unavailable on runner. This candidate is not security-certified.'
          }
      - name: Upload candidate files (not a certified release)
        uses: actions/upload-artifact@v4
        with:
          name: AURENIX-PRO-V0.7.3-Windows-SIGNED-CANDIDATE
          path: |
            v0.7.3/dist/AURENIX-PRO/**
            v0.7.3/Installer/AURENIX-PRO-BG-Remover-V0.7.3-Setup.exe
            v0.7.3/WINDOWS_SECURITY_REPORT.json
          if-no-files-found: error
