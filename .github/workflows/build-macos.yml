name: Build AURENIX PRO macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main, windows-royal-gold-installer]
    paths:
      - 'aurenix_pro.py'
      - 'royal_gold_ui.py'
      - 'assets/**'
      - 'requirements-windows-build.txt'
      - 'tests/**'
      - 'background_remover_pro.py'
      - 'macos_runtime_hook.py'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS Apple Silicon standalone app and DMG
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout AURENIX PRO source
        uses: actions/checkout@v4

      - name: Set up ARM64 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Install build and AI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows-build.txt
          python -m pip check

      - name: Verify Python source
        run: |
          python -m py_compile aurenix_pro.py royal_gold_ui.py background_remover_pro.py macos_runtime_hook.py
          python -c "import platform; print('Platform:', platform.platform(), 'Architecture:', platform.machine()); assert platform.machine() == 'arm64', 'ARM64 runner required'"
          QT_QPA_PLATFORM=offscreen python tests/smoke_royal_gold.py
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -p 'test_aurenix_gui.py' -v

      - name: Download BiRefNet General model once for bundling
        env:
          U2NET_HOME: ${{ github.workspace }}/models
        run: |
          mkdir -p models
          python - <<'PY'
          from rembg import new_session
          new_session("birefnet-general")
          print("BiRefNet General initialized successfully")
          PY
          find models -type f -maxdepth 3 -print
          test -n "$(find models -type f -name '*.onnx' -print -quit)"

      - name: Build standalone ARM64 .app
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "AURENIX PRO" \
            --target-arch arm64 \
            --runtime-hook macos_runtime_hook.py \
            --add-data "models:models" \
            --add-data "assets:assets" \
            --collect-all rembg \
            --collect-all onnxruntime \
            --collect-all pymatting \
            aurenix_pro.py
          test -d "dist/AURENIX PRO.app"
          test -f "dist/AURENIX PRO.app/Contents/MacOS/AURENIX PRO"
          find "dist/AURENIX PRO.app/Contents" -name '*.onnx' -print
          test -n "$(find 'dist/AURENIX PRO.app/Contents' -name '*.onnx' -print -quit)"
          file "dist/AURENIX PRO.app/Contents/MacOS/AURENIX PRO"
          lipo -archs "dist/AURENIX PRO.app/Contents/MacOS/AURENIX PRO" | grep -q arm64
          codesign --force --deep --sign - "dist/AURENIX PRO.app"
          codesign --verify --deep "dist/AURENIX PRO.app"

      - name: Package .app into macOS DMG
        run: |
          mkdir -p dmg_staging releases
          cp -R "dist/AURENIX PRO.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "AURENIX PRO" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "releases/AURENIX-PRO-macOS-AppleSilicon.dmg"
          hdiutil verify "releases/AURENIX-PRO-macOS-AppleSilicon.dmg"
          shasum -a 256 "releases/AURENIX-PRO-macOS-AppleSilicon.dmg"

      - name: Upload compiled DMG as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURENIX-PRO-macOS-AppleSilicon
          path: |
            releases/AURENIX-PRO-macOS-AppleSilicon.dmg
            build-preview/aurenix-royal-gold-ui.png
          if-no-files-found: error
          retention-days: 14
